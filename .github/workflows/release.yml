name: Release

# Bumping VERSION in build-app.sh and pushing to main is the whole release process: this builds that version,
# checks it, packs the installer and publishes it with its CHANGELOG.md section as the notes. A version that already
# has a release is left alone, so pushes that don't bump the version do nothing.
on:
  push:
    branches: [main]
    paths: [build-app.sh]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, and never cut short by a newer push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this version new?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' build-app.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already released - nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  slice:
    name: ${{ matrix.arch }} slice
    needs: check
    if: needs.check.outputs.new == 'true'
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: ./build-app.sh
      # The release job runs on Apple silicon, so its launch test only ever starts the arm64 half of the universal
      # app. Each half is started here instead, on a Mac of its own kind.
      - name: Launch it and wait for its window
        run: ./.github/scripts/smoke-test.sh build/Cartridge.app
      - name: Check it is really ${{ matrix.arch }}
        run: |
          binary="$(swift build -c release --product Cartridge --show-bin-path)/Cartridge"
          lipo -info "${binary}" | grep -q "${{ matrix.arch }}"
          cp "${binary}" "${RUNNER_TEMP}/Cartridge-${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cartridge-${{ matrix.arch }}
          path: ${{ runner.temp }}/Cartridge-${{ matrix.arch }}
          retention-days: 1

  release:
    name: Release ${{ needs.check.outputs.version }}
    needs: [check, slice]
    if: needs.check.outputs.new == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the notes fall back to the commits since the last release
      - name: Test
        run: swift test
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.1
        with:
          pattern: cartridge-*
          path: ${{ runner.temp }}/slices
          merge-multiple: true
      - name: Join the two architectures
        run: |
          lipo -create -output "${RUNNER_TEMP}/Cartridge-universal" \
            "${RUNNER_TEMP}/slices/Cartridge-arm64" "${RUNNER_TEMP}/slices/Cartridge-x86_64"
          lipo -info "${RUNNER_TEMP}/Cartridge-universal"
      - name: Build Cartridge.app
        env:
          CARTRIDGE_BIN: ${{ runner.temp }}/Cartridge-universal
        run: ./build-app.sh
      - name: It must run on both kinds of Mac
        run: |
          lipo -info build/Cartridge.app/Contents/MacOS/Cartridge | tee /dev/stderr | grep -q "x86_64 arm64\|arm64 x86_64"
          codesign --verify --strict build/Cartridge.app
      - name: Launch it and wait for its window
        run: ./.github/scripts/smoke-test.sh build/Cartridge.app
      - name: Pack the installer
        run: ./.github/scripts/make-dmg.sh
      - name: Write the notes
        run: ./.github/scripts/release-notes.sh "${VERSION}" > "${RUNNER_TEMP}/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "build/Cartridge-${VERSION}.dmg" \
            --title "Cartridge ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --target "${GITHUB_SHA}"
