<!doctype html>
<html><head><meta charset="utf-8"><title>Cartridge icon v2</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .icon { position: absolute; inset: 0; filter: drop-shadow(0 18px 22px rgba(0,0,0,.28)) drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
  .plate { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  svg.over { position: absolute; inset: 0; width: 1024px; height: 1024px; overflow: visible; }
</style></head>
<body>
<div class="icon"><div class="plate" id="plate"></div></div>
<script>
const V = new URLSearchParams(location.search).get('v') || 'd1';
const plate = document.getElementById('plate');
const NS = 'http://www.w3.org/2000/svg';
let uid = 0;

// Apple-style continuous corner: superellipse over the 824px icon grid.
function squircle(x0, y0, size, n = 4.2) {
  const c = size / 2, pts = [];
  for (let i = 0; i < 360; i++) {
    const t = i / 360 * 2 * Math.PI, ct = Math.cos(t), st = Math.sin(t);
    pts.push([x0 + c + c * Math.sign(ct) * Math.abs(ct) ** (2 / n), y0 + c + c * Math.sign(st) * Math.abs(st) ** (2 / n)]);
  }
  return 'M' + pts.map(p => p.map(v => v.toFixed(2)).join(' ')).join('L') + 'Z';
}
const PLATE = squircle(100, 100, 824);
plate.style.clipPath = `path('${PLATE}')`;

// Polygon with every vertex rounded (convex or concave) by radius r.
function roundPoly(pts, r) {
  let d = '';
  pts.forEach((p, i) => {
    const a = pts[(i - 1 + pts.length) % pts.length], b = pts[(i + 1) % pts.length];
    const u = (q) => { const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy); return [p[0] + dx / l * r, p[1] + dy / l * r]; };
    const s = u(a), e = u(b);
    d += (i ? 'L' : 'M') + s.join(' ') + 'Q' + p.join(' ') + ' ' + e.join(' ');
  });
  return d + 'Z';
}

function div(style, parent = plate, html = '') {
  const e = document.createElement('div'); e.className = 'abs'; e.style.cssText = style; e.innerHTML = html; parent.appendChild(e); return e;
}
function svg(markup, parent = plate) {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'over'); s.setAttribute('viewBox', '0 0 1024 1024');
  s.innerHTML = markup; parent.appendChild(s); return s;
}
const blob = (x, y, r, c, o = 1, b = 60) => div(`left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;background:${c};opacity:${o};filter:blur(${b}px)`);

// A Liquid Glass slab in the shape of path d: real backdrop refraction + lit edges.
function glass(d, { tint = 'rgba(255,255,255,.16)', blur = 22, sat = 1.8, bright = 1.08, shadow = .35, edge = 1, glowTop = .9, parent = plate, k = 1 } = {}) {
  // k = parent scale, so edges/shadows stay the same on-screen thickness
  const id = 'g' + (uid++);
  svg(`<defs><filter id="${id}s" filterUnits="userSpaceOnUse" x="-1000" y="-1000" width="3000" height="3000"><feGaussianBlur stdDeviation="${26 / k}"/></filter><filter id="${id}t" filterUnits="userSpaceOnUse" x="-1000" y="-1000" width="3000" height="3000"><feGaussianBlur stdDeviation="${6 / k}"/></filter></defs>
       <path d="${d}" fill="#000" opacity="${shadow}" filter="url(#${id}s)" transform="translate(0 ${30 / k})"/>
       <path d="${d}" fill="#000" opacity="${shadow * .5}" transform="translate(0 ${8 / k})" filter="url(#${id}t)"/>`, parent);
  div(`inset:0;clip-path:path('${d}');background:${tint};backdrop-filter:blur(${blur / k}px) saturate(${sat}) brightness(${bright});-webkit-backdrop-filter:blur(${blur / k}px) saturate(${sat}) brightness(${bright})`, parent);
  svg(`<defs>
        <linearGradient id="${id}e" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="${glowTop * edge}"/><stop offset=".35" stop-color="#fff" stop-opacity="${.18 * edge}"/>
          <stop offset=".7" stop-color="#fff" stop-opacity="${.1 * edge}"/><stop offset="1" stop-color="#fff" stop-opacity="${.55 * edge}"/></linearGradient>
        <linearGradient id="${id}f" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
        <clipPath id="${id}c"><path d="${d}"/></clipPath>
        <filter id="${id}b"><feGaussianBlur stdDeviation="${10 / k}"/></filter>
      </defs>
      <path d="${d}" fill="url(#${id}f)"/>
      <g clip-path="url(#${id}c)">
        <path d="${d}" fill="none" stroke="url(#${id}e)" stroke-width="${34 / k}" filter="url(#${id}b)" opacity=".55"/>
        <path d="${d}" fill="none" stroke="url(#${id}e)" stroke-width="${4 / k}"/>
      </g>`, parent);
  return id;
}

// Rim + faint sheen on the plate itself, drawn last.
function plateFinish(sheen = .35, rim = .5) {
  svg(`<defs><linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="${rim}"/><stop offset=".5" stop-color="#fff" stop-opacity="${rim * .15}"/><stop offset="1" stop-color="#fff" stop-opacity="${rim * .5}"/></linearGradient>
       <radialGradient id="sh" cx=".5" cy="-.1" r=".75"><stop offset="0" stop-color="#fff" stop-opacity="${sheen}"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
       <path d="${PLATE}" fill="url(#sh)"/><path d="${PLATE}" fill="none" stroke="url(#rim)" stroke-width="4"/>`);
}

function pixelShape(rows, x0, y0, s, fill, extra = '') {
  let out = '';
  rows.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '#') out += `<rect x="${x0 + c * s}" y="${y0 + r * s}" width="${s + .5}" height="${s + .5}" fill="${fill}" ${extra}/>`; }));
  return out;
}
const sparkle = (x, y, s, o = 1) => { const k = s * 4.2, q = s * .55; return `<path opacity="${o}" fill="#fff" style="filter:drop-shadow(0 0 ${s * 1.6}px rgba(255,255,255,.9))" d="M${x} ${y - k}Q${x + q} ${y - q} ${x + k} ${y}Q${x + q} ${y + q} ${x} ${y + k}Q${x - q} ${y + q} ${x - k} ${y}Q${x - q} ${y - q} ${x} ${y - k}Z"/>`; };

// ---- D-pad geometry --------------------------------------------------------
const W = 118, L = 282; // half arm width, half span
const C = 512;
const CROSS = roundPoly([
  [C - W, C - L], [C + W, C - L], [C + W, C - W], [C + L, C - W], [C + L, C + W], [C + W, C + W],
  [C + W, C + L], [C - W, C + L], [C - W, C + W], [C - L, C + W], [C - L, C - W], [C - W, C - W]], 44);
function arrows(fill, shadowCol, pixel = false) {
  const tri = (cx, cy, rot) => pixel
    ? `<g transform="rotate(${rot} ${cx} ${cy})">${pixelShape(['...#...', '..###..', '.#####.', '#######', '#######'], cx - 3.5 * 14, cy - 2.2 * 14, 14, fill)}</g>`
    : `<path transform="rotate(${rot} ${cx} ${cy})" d="${roundPoly([[cx, cy - 34], [cx + 46, cy + 30], [cx - 46, cy + 30]], 12)}" fill="${fill}"/>`;
  const all = tri(C, C - 190, 0) + tri(C + 190, C, 90) + tri(C, C + 190, 180) + tri(C - 190, C, 270);
  return `<defs><filter id="as" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="${shadowCol}" flood-opacity=".45"/></filter></defs><g filter="url(#as)">${all}</g>`;
}
const dimple = (dark = .22) => `<defs><radialGradient id="dm" cx=".5" cy=".35" r=".65"><stop offset="0" stop-color="#000" stop-opacity="${dark}"/><stop offset=".8" stop-color="#000" stop-opacity="${dark * .3}"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></radialGradient></defs>
  <linearGradient id="dl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="${dark}"/><stop offset="1" stop-color="#fff" stop-opacity=".75"/></linearGradient><circle cx="${C}" cy="${C}" r="64" fill="url(#dm)"/><circle cx="${C}" cy="${C}" r="63" fill="none" stroke="url(#dl)" stroke-width="3"/>`;

const VARIANTS = {
  // D1 Sapphire: clear glass D-pad refracting a neon orb on midnight blue
  d1() {
    div(`inset:0;background:linear-gradient(165deg,#1b3a8f 0%,#0d1b54 45%,#050a24 100%)`);
    blob(512, 560, 250, 'conic-gradient(from 200deg,#29e3ff,#5b6cff,#c34dff,#ff4fa8,#29e3ff)', .95, 40);
    blob(250, 240, 180, '#2fb8ff', .55, 80);
    blob(800, 830, 200, '#7b3cff', .55, 90);
    glass(CROSS, { tint: 'linear-gradient(170deg,rgba(255,255,255,.28),rgba(255,255,255,.06))', blur: 30, sat: 2, bright: 1.15, shadow: .5 });
    svg(arrows('rgba(255,255,255,.95)', '#0a0a40') + dimple(.3));
    plateFinish(.28, .55);
  },
  // D2 Frost: light, Apple-system feel; face-button colours glow through the glass
  d2() {
    div(`inset:0;background:linear-gradient(170deg,#ffffff 0%,#eef1f7 50%,#d9dfea 100%)`);
    blob(512, C - 200, 120, '#ff3b5c', .85, 36);
    blob(C + 200, 512, 120, '#ffc42e', .85, 36);
    blob(512, C + 200, 120, '#30d158', .85, 36);
    blob(C - 200, 512, 120, '#0a84ff', .85, 36);
    glass(CROSS, { tint: 'linear-gradient(170deg,rgba(255,255,255,.45),rgba(255,255,255,.15))', blur: 34, sat: 1.6, bright: 1.12, shadow: .22, glowTop: 1 });
    svg(arrows('rgba(255,255,255,.98)', '#1c2440') + dimple(.12));
    plateFinish(.15, .9);
  },
  // D3 Arcade: tinted candy glass over a pixel mosaic, pixel arrows
  d3() {
    div(`inset:0;background:linear-gradient(160deg,#3a0f5c 0%,#1e0833 60%,#0c0418 100%)`);
    const cv = document.createElement('canvas'); cv.width = cv.height = 1024; cv.className = 'abs'; cv.style.cssText = 'inset:0'; plate.appendChild(cv);
    const g = cv.getContext('2d'), pal = ['#ff4fa8', '#ffb13b', '#ffe44d', '#3bf0ff', '#8a5cff', '#ff5a5a'];
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let y = 0; y < 1024; y += 32) for (let x = 0; x < 1024; x += 32) {
      const d = Math.hypot(x - 512, y - 512) / 520;
      if (rnd() < .7 - d * .75) { g.globalAlpha = (.35 + rnd() * .65) * Math.max(0, 1 - d * 1.1); g.fillStyle = pal[(rnd() * pal.length) | 0]; g.fillRect(x + 2, y + 2, 28, 28); }
    }
    glass(CROSS, { tint: 'linear-gradient(165deg,rgba(255,90,190,.42),rgba(255,150,60,.28))', blur: 18, sat: 1.6, bright: 1.05, shadow: .55 });
    svg(`<g opacity=".1">${Array.from({ length: 128 }, (_, i) => `<rect x="100" y="${100 + i * 6.5}" width="824" height="2" fill="#000"/>`).join('')}</g>` + arrows('#fff', '#40002a', true) + dimple(.25));
    plateFinish(.25, .5);
  },

  // ---- discs ---------------------------------------------------------------
  r1() { discScene({ bg: 'linear-gradient(165deg,#3b3d4a 0%,#1a1b22 55%,#08080c 100%)', glow: ['#7a5cff', '#ff4fa8'] }); },
  // R2: disc sliding out of a frosted jewel case, rainbow bleeding through the frost
  r2() {
    div(`inset:0;background:linear-gradient(165deg,#1d2b64 0%,#3a1c71 55%,#12092b 100%)`);
    blob(760, 300, 200, '#ff4fa8', .55, 80); blob(260, 800, 220, '#29d3ff', .45, 80);
    disc(620, 420, 250);
    const d = roundPoly([[178, 318], [698, 318], [698, 838], [178, 838]], 34);
    glass(d, { tint: 'linear-gradient(165deg,rgba(255,255,255,.32),rgba(255,255,255,.1))', blur: 16, sat: 1.4, bright: 1.1, shadow: .5 });
    svg(`<rect x="178" y="318" width="56" height="520" rx="0" fill="#fff" opacity=".12" clip-path="inset(0 round 34px 0 0 34px)"/>` +
        Array.from({ length: 12 }, (_, i) => `<rect x="196" y="${370 + i * 36}" width="20" height="6" rx="3" fill="#fff" opacity=".45"/>`).join('') +
        `<line x1="234" y1="330" x2="234" y2="826" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>` +
        pixelShape(['.####.', '##..##', '##....', '##....', '##..##', '.####.'], 278, 740, 9, '#fff', 'opacity=".85"') + sparkle(820, 250, 7, .9));
    plateFinish(.25, .55);
  },
  // R3: disc floating in perspective with an underglow, pixel sparkles
  r3() {
    div(`inset:0;background:radial-gradient(120% 90% at 50% 0%,#2b2f55 0%,#141630 55%,#07070f 100%)`);
    blob(512, 640, 300, 'conic-gradient(#ff4fa8,#ffb13b,#7cffb2,#29d3ff,#8a5cff,#ff4fa8)', .6, 70);
    const w = div(`inset:0;perspective:1100px`);
    const t = div(`left:0;top:-30px;width:1024px;height:1024px;transform:rotateX(52deg) rotateZ(-24deg);transform-style:preserve-3d`, w);
    for (let k = 14; k > 0; k -= 2) div(`left:${192}px;top:${192}px;width:640px;height:640px;border-radius:50%;transform:translateZ(-${k}px);background:radial-gradient(circle,transparent 44px,#8d93a8 45px,#b9bfd0 90%,#e6e9f2 100%);-webkit-mask:radial-gradient(circle,transparent 0 44px,#000 45px)`, t);
    disc(512, 512, 320, t, true);
    svg(sparkle(250, 270, 9, .95) + sparkle(790, 230, 6, .8) + sparkle(820, 760, 8, .9) + sparkle(210, 740, 5, .7));
    plateFinish(.22, .5);
  },
};

// Iridescent CD: silver base, conic rainbow, light cross, grooves, clear hub, mirror ring.
function disc(cx, cy, R, parent = plate, flat = false) {
  const hole = R * .14, hub = R * .38, mirror = R * .45;
  const box = div(`left:${cx - R}px;top:${cy - R}px;width:${2 * R}px;height:${2 * R}px;border-radius:50%;
    filter:drop-shadow(0 ${flat ? 50 : 26}px ${flat ? 50 : 30}px rgba(0,0,0,.5))`, parent);
  const cut = `-webkit-mask:radial-gradient(circle,transparent 0 ${hole}px,#000 ${hole + 1}px);mask:radial-gradient(circle,transparent 0 ${hole}px,#000 ${hole + 1}px)`;
  const inner = div(`inset:0;border-radius:50%;${cut}`, box);
  // clear polycarbonate hub (refracts what's behind)
  div(`inset:0;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(10px) brightness(1.2) saturate(1.5)`, inner);
  // data area: everything outside the mirror ring
  const data = div(`inset:0;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 0 ${mirror}px,#000 ${mirror + 1}px);mask:radial-gradient(circle,transparent 0 ${mirror}px,#000 ${mirror + 1}px)`, inner);
  div(`inset:0;border-radius:50%;background:radial-gradient(circle,#f4f6fb 0%,#d8dde8 70%,#c5cbd8 100%)`, data);
  div(`inset:0;border-radius:50%;opacity:.8;background:conic-gradient(from 15deg,#ff6ad5,#ffcf6a,#9dff8a,#5ae0ff,#8f7bff,#ff6ad5,#ffcf6a,#9dff8a,#5ae0ff,#8f7bff,#ff6ad5)`, data);
  div(`inset:0;border-radius:50%;mix-blend-mode:screen;opacity:.85;filter:blur(${R * .02}px);background:conic-gradient(from -8deg,#fff 0deg,transparent 14deg,transparent 166deg,#fff 180deg,transparent 194deg,transparent 346deg,#fff 360deg)`, data);
  div(`inset:0;border-radius:50%;mix-blend-mode:overlay;background:repeating-radial-gradient(circle,rgba(255,255,255,0) 0 ${R * .012}px,rgba(255,255,255,.35) ${R * .012}px ${R * .018}px)`, data);
  div(`inset:0;border-radius:50%;background:radial-gradient(circle,transparent ${mirror}px,rgba(255,255,255,.35) ${mirror + 4}px,transparent ${mirror + 14}px)`, data);
  // mirrored stacking ring
  div(`left:${R - mirror}px;top:${R - mirror}px;width:${2 * mirror}px;height:${2 * mirror}px;border-radius:50%;
       -webkit-mask:radial-gradient(circle,transparent 0 ${hub}px,#000 ${hub + 1}px);mask:radial-gradient(circle,transparent 0 ${hub}px,#000 ${hub + 1}px);
       background:conic-gradient(from 40deg,#f7f8fb,#a9b0c0,#ffffff,#8e95a6,#f7f8fb,#b5bccb,#ffffff,#a0a7b7,#f7f8fb);opacity:.9`, inner);
  // edges + specular sweep
  div(`inset:0;border-radius:50%;box-shadow:inset 0 0 0 ${R * .008}px rgba(255,255,255,.85),inset 0 ${R * .02}px ${R * .04}px rgba(255,255,255,.6),inset 0 -${R * .03}px ${R * .06}px rgba(40,20,90,.25)`, inner);
  div(`inset:0;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%);mix-blend-mode:soft-light`, inner);
  div(`left:${R - hole - 2}px;top:${R - hole - 2}px;width:${2 * hole + 4}px;height:${2 * hole + 4}px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.6),inset 0 4px 10px rgba(0,0,0,.35)`, box);
}

function discScene({ bg, glow }) {
  div(`inset:0;background:${bg}`);
  blob(512, 600, 300, glow[0], .55, 90); blob(760, 250, 180, glow[1], .35, 90);
  disc(512, 512, 330);
  svg(sparkle(745, 330, 8, .95) + sparkle(300, 720, 5, .7));
  plateFinish(.22, .45);
}

</script>
<script src="consoles_v3.js"></script>
<script>VARIANTS[V]();</script>
</body></html>
